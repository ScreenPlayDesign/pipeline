name: dress-rehearsal

# Performs every Gherkin scene against the project's staging site and staging
# database, posts the result to screenplaydesign.com, and sets the commit
# status `screenplay / dress rehearsal` — the check the staging → prod PR
# requires. Spec: web-dashboard/docs/superpowers/specs/2026-10-14-rehearsal-gate-design.md
#
# Four jobs, so project code never runs where a token or the right to set
# statuses lives:
#   start   — config, pending status, wait for staging (no project code)
#   reset   — runs reset.sql as SQL text through Bun's driver; the only job given STAGING_DB_URL
#   perform — project code only: Playwright against staging (no DB URL, no dashboard token, no status rights),
#             inside Microsoft's Playwright image at the project's own version (bun.lock), so the
#             browser and its system libraries are already there
#   verdict — fresh runner, no project code executed: posts and sets the status
# Pipeline scripts run from $RUNNER_TEMP/spd-pipeline with --no-env-file, so a
# project's bunfig.toml or .env can never load into them.
on:
  workflow_call:
    inputs:
      pipeline-ref:
        description: 'The ScreenPlayDesign/pipeline commit this caller pins (the scripts are checked out at it)'
        type: string
        required: true
      api-url:
        description: 'SPD dashboard cli-api URL'
        type: string
        default: 'https://hrbfsfvyatrdxegogdfz.supabase.co/functions/v1/cli-api'
    secrets:
      SPD_REHEARSAL_TOKEN:
        description: "The project's rehearsal-only token (spd ci setup)"
        required: false
      STAGING_DB_URL:
        required: false
      STAGING_SUPABASE_URL:
        required: false
      STAGING_SUPABASE_PUBLISHABLE_KEY:
        required: false

permissions:
  contents: read

env:
  CONTEXT: screenplay / dress rehearsal

jobs:
  start:
    name: Wait for staging
    runs-on: ${{ fromJSON(vars.SPD_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 35
    permissions:
      contents: read
      statuses: write
    outputs:
      slug: ${{ steps.cfg.outputs.slug }}
      staging_url: ${{ steps.cfg.outputs.staging_url }}
      waited: ${{ steps.wait.outcome }}
      wait_reason: ${{ steps.wait.outputs.reason }}
      playwright_image: ${{ steps.cfg.outputs.playwright_image }}
      playwright_matched: ${{ steps.cfg.outputs.playwright_matched }}
    steps:
      # bun.lock is read as text for the Playwright version (playwrightImage.ts); nothing from the project runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /spd_config.toml
            /bun.lock
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ScreenPlayDesign/pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: .spd-pipeline
          persist-credentials: false
      - name: Move the pipeline out of the project checkout
        run: mv .spd-pipeline "$RUNNER_TEMP/spd-pipeline"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Read spd_config.toml
        id: cfg
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          cd "$RUNNER_TEMP/spd-pipeline"
          bun --no-env-file scripts/rehearsal/cli.ts config >> "$GITHUB_OUTPUT"
      - name: Mark the rehearsal pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TARGET: https://screenplaydesign.com/pr/${{ steps.cfg.outputs.slug }}/screenplay
        run: |
          gh api "repos/$REPO/statuses/$SHA" -f state=pending -f context="$CONTEXT" \
            -f description='Waiting for staging to deploy' -f target_url="$TARGET" >/dev/null
      - name: Wait until staging serves this commit and its migrations are applied
        id: wait
        env:
          STAGING_URL: ${{ steps.cfg.outputs.staging_url }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/spd-pipeline"
          bun --no-env-file scripts/rehearsal/cli.ts wait
          bun --no-env-file scripts/rehearsal/cli.ts wait-migrations

  reset:
    name: Reset the cast on staging
    needs: start
    if: needs.start.outputs.waited == 'success'
    runs-on: ${{ fromJSON(vars.SPD_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Only reset.sql is fetched; it is run as SQL text by Bun's driver, never by psql or a shell.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: /supabase/testing/reset.sql
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ScreenPlayDesign/pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: .spd-pipeline
          persist-credentials: false
      - name: Move the pipeline out of the project checkout
        run: mv .spd-pipeline "$RUNNER_TEMP/spd-pipeline"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Reset the cast
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          cd "$RUNNER_TEMP/spd-pipeline"
          bun --no-env-file scripts/rehearsal/cli.ts reset-cast

  perform:
    name: Perform every scene on staging
    needs: [start, reset]
    if: needs.start.outputs.waited == 'success' && needs.reset.result == 'success'
    runs-on: ${{ fromJSON(vars.SPD_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 45
    # Chromium and its libraries come with the image (the version check is in playwrightImage.ts).
    container: ${{ needs.start.outputs.playwright_image }}
    permissions:
      contents: read
    outputs:
      playwright: ${{ steps.playwright.outcome }}
      artifact: ${{ steps.evidence.outputs.name }}
    steps:
      # setup-bun unpacks a zip; checkout wants git. The image normally has both: this costs nothing then.
      - name: Tools the actions need
        run: |
          missing=""
          command -v git   >/dev/null || missing="$missing git"
          command -v unzip >/dev/null || missing="$missing unzip"
          if [ -n "$missing" ]; then apt-get update -qq && apt-get install -y -qq --no-install-recommends $missing; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ScreenPlayDesign/pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: .spd-pipeline
          persist-credentials: false
      - name: Move the pipeline out of the project checkout
        run: mv .spd-pipeline "$RUNNER_TEMP/spd-pipeline"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      # Project code runs here. This job is never given STAGING_DB_URL, the dashboard token or status rights.
      - name: Install dependencies
        run: bun install
      # Only when bun.lock named no Playwright version: the default image's browser may not match.
      - name: Install the project's Chromium
        if: needs.start.outputs.playwright_matched != 'true'
        run: bunx playwright install chromium
      - name: Perform the scenes
        id: playwright
        continue-on-error: true
        env:
          CI: '1'
          E2E_CAST: '1'
          SPD_ALLOW_HOST_DEV: '1'
          BASE_URL: ${{ needs.start.outputs.staging_url }}
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/review/results.json
        run: |
          cfg=$(PROJECT_ROOT="$GITHUB_WORKSPACE" bun --no-env-file "$RUNNER_TEMP/spd-pipeline/scripts/rehearsal/cli.ts" playwright-config)
          bunx playwright test ${cfg:+--config "$cfg"} --retries=0 --workers="$(nproc)" --reporter=line,json
      - name: Build the walkthrough report
        if: always()
        run: |
          if grep -q '"report:walkthrough"' package.json; then bun run report:walkthrough || true; fi
      - name: Name the evidence
        id: evidence
        if: always()
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: echo "name=dress-rehearsal-${RUN_NUMBER}-${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: review/
          retention-days: 14

  verdict:
    name: Post the verdict
    needs: [start, reset, perform]
    # Not always(): a run cancelled by a newer staging push must not post an error for the superseded commit.
    # A failed start (e.g. the wait timing out) is not a cancellation, so it still reaches here.
    if: ${{ !cancelled() && needs.start.outputs.slug != '' }}
    runs-on: ${{ fromJSON(vars.SPD_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      # Project files are read as data only; nothing from the project is executed here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /spd_config.toml
            /screenplay/
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ScreenPlayDesign/pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: .spd-pipeline
          persist-credentials: false
      - name: Move the pipeline out of the project checkout
        run: mv .spd-pipeline "$RUNNER_TEMP/spd-pipeline"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Fetch the evidence
        if: needs.perform.outputs.artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.perform.outputs.artifact }}
          path: review
      - name: Post the rehearsal to the dashboard
        id: post
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          WAITED: ${{ needs.start.outputs.waited }}
          WAIT_REASON: ${{ needs.start.outputs.wait_reason }}
          RESET_RESULT: ${{ needs.reset.result }}
          PLAYWRIGHT_OUTCOME: ${{ needs.perform.outputs.playwright }}
          SPD_REHEARSAL_TOKEN: ${{ secrets.SPD_REHEARSAL_TOKEN }}
          SPD_API_URL: ${{ inputs.api-url }}
          SPD_PROJECT_SLUG: ${{ needs.start.outputs.slug }}
          BASE_URL: ${{ needs.start.outputs.staging_url }}
        run: |
          cd "$RUNNER_TEMP/spd-pipeline"
          bun --no-env-file scripts/rehearsal/cli.ts post
      - name: Set the gate's commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERDICT: ${{ steps.post.outputs.verdict }}
          DESC: ${{ steps.post.outputs.description }}
          WAITED: ${{ needs.start.outputs.waited }}
          WAIT_REASON: ${{ needs.start.outputs.wait_reason }}
          TARGET: https://screenplaydesign.com/pr/${{ needs.start.outputs.slug }}/screenplay
        run: |
          if [ "$WAITED" != success ]; then VERDICT=error; DESC="${WAIT_REASON:-Staging was not ready — see the run log}"; fi
          case "$VERDICT" in
            passed) STATE=success ;;
            failed) STATE=failure ;;
            *)      STATE=error; DESC="${DESC:-The rehearsal did not finish — see the run log}" ;;
          esac
          gh api "repos/$REPO/statuses/$SHA" -f state="$STATE" -f context="$CONTEXT" \
            -f description="${DESC:0:140}" -f target_url="$TARGET" >/dev/null
          echo "$CONTEXT: $STATE — $DESC"
          [ "$STATE" = success ]
