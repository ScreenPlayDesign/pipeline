name: approve-screenshots

# Renders every scene on Linux against staging and commits new or changed
# *-linux.png baselines to the `design` lane, whose PR shows each image and
# its diff for the designer to approve. Run by hand. Never touches -darwin.png.
#
# Two jobs, so the design lane's code (bun install, Playwright) never runs
# where PR_BOT_TOKEN — which can push past the prod gate — is readable:
# `render` runs the lane code with no bot token and uploads only the changed
# *-linux.png files; `commit` checks those paths and pushes them, handing the
# token to the push command alone.
on:
  workflow_call:
    inputs:
      pipeline-ref:
        type: string
        required: true
    secrets:
      PR_BOT_TOKEN:
        required: false
      STAGING_DB_URL:
        required: false
      STAGING_SUPABASE_URL:
        required: false
      STAGING_SUPABASE_PUBLISHABLE_KEY:
        required: false

env:
  SPD_BUN_DEFAULT: '1.3.14'

permissions:
  contents: read

jobs:
  require-token:
    name: Require PR_BOT_TOKEN
    runs-on: ${{ fromJSON(vars.SPD_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Require PR_BOT_TOKEN
        env:
          PR_BOT_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
        run: |
          if [ -z "$PR_BOT_TOKEN" ]; then
            echo "::error::PR_BOT_TOKEN is not set — a push with the default token would not run the design lane's CI."
            exit 1
          fi

  reset:
    name: Reset the cast on staging
    needs: require-token
    runs-on: ${{ fromJSON(vars.SPD_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Only reset.sql is fetched; it is run as SQL text by Bun's driver, never by psql or a shell.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: design
          sparse-checkout: |
            /supabase/testing/reset.sql
            /package.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ScreenPlayDesign/pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: .spd-pipeline
          persist-credentials: false
      - name: Move the pipeline out of the project checkout
        run: mv .spd-pipeline "$RUNNER_TEMP/spd-pipeline"
      # The Bun the project asks for (package.json "packageManager": "bun@x.y.z"), else the one pinned default.
      - name: Pick the Bun version
        id: bun
        run: |
          v=$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"bun@\([0-9][0-9.]*\)[^"]*".*/\1/p' package.json 2>/dev/null | head -1)
          echo "version=${v:-$SPD_BUN_DEFAULT}" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}
          no-cache: true
      - name: Reset the cast
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          cd "$RUNNER_TEMP/spd-pipeline"
          bun --no-env-file scripts/rehearsal/cli.ts reset-cast

  render:
    name: Render Linux baselines
    needs: [require-token, reset]
    runs-on: ${{ fromJSON(vars.SPD_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: design
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ScreenPlayDesign/pipeline
          ref: ${{ inputs.pipeline-ref }}
          path: .spd-pipeline
          persist-credentials: false
      - name: Move the pipeline out of the project checkout
        run: mv .spd-pipeline "$RUNNER_TEMP/spd-pipeline"
      # The Bun the project asks for (package.json "packageManager": "bun@x.y.z"), else the one pinned default.
      - name: Pick the Bun version
        id: bun
        run: |
          v=$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"bun@\([0-9][0-9.]*\)[^"]*".*/\1/p' package.json 2>/dev/null | head -1)
          echo "version=${v:-$SPD_BUN_DEFAULT}" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}
          no-cache: true
      - name: Read spd_config.toml
        id: cfg
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          cd "$RUNNER_TEMP/spd-pipeline"
          bun --no-env-file scripts/rehearsal/cli.ts config >> "$GITHUB_OUTPUT"
      - name: Install dependencies and Chromium
        run: |
          bun install
          bunx playwright install --with-deps chromium
      - name: Render the scenes, writing changed baselines
        id: render
        continue-on-error: true
        env:
          CI: '1'
          E2E_CAST: '1'
          SPD_ALLOW_HOST_DEV: '1'
          BASE_URL: ${{ steps.cfg.outputs.staging_url }}
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cfg=$(PROJECT_ROOT="$GITHUB_WORKSPACE" bun --no-env-file "$RUNNER_TEMP/spd-pipeline/scripts/rehearsal/cli.ts" playwright-config)
          bunx playwright test ${cfg:+--config "$cfg"} --retries=0 --workers="$(nproc)" --update-snapshots=changed --reporter=line
      - name: Collect the new and changed Linux baselines
        id: collect
        env:
          RENDERED: ${{ steps.render.outcome }}
        run: |
          git ls-files -z --others --exclude-standard --modified -- '*-linux.png' > "$RUNNER_TEMP/baselines.txt"
          COUNT="$(tr -cd '\0' < "$RUNNER_TEMP/baselines.txt" | wc -c | tr -d ' ')"
          if [ "$COUNT" = 0 ]; then
            if [ "$RENDERED" = failure ]; then
              echo "::error::Playwright failed and wrote no baselines — see the render step's log."
              exit 1
            fi
            echo "No new or changed Linux baselines."
          else
            mkdir -p "$RUNNER_TEMP/baselines"
            xargs -0 -a "$RUNNER_TEMP/baselines.txt" cp --parents -t "$RUNNER_TEMP/baselines" --
            echo "$COUNT new or changed Linux baseline(s)."
          fi
          echo "changed=$COUNT" >> "$GITHUB_OUTPUT"
      - name: Hand the baselines to the commit job
        if: steps.collect.outputs.changed != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-baselines
          path: ${{ runner.temp }}/baselines/
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit the Linux baselines to the design lane
    needs: render
    if: needs.render.outputs.changed != '0'
    runs-on: ${{ fromJSON(vars.SPD_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: design
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-baselines
          path: ${{ runner.temp }}/baselines
      - name: Accept only *-linux.png baselines
        run: |
          cd "$RUNNER_TEMP/baselines"
          find . -mindepth 1 ! -type d -printf '%P\n' > "$RUNNER_TEMP/baselines.txt"
          BAD=0
          while IFS= read -r f; do
            case "$f" in
              *..*|.git/*|*/.git/*) echo "::error::Rejected path: $f"; BAD=1; continue ;;
            esac
            if [ ! -f "$f" ] || [ -L "$f" ]; then echo "::error::Rejected non-file: $f"; BAD=1; continue; fi
            case "$f" in
              *-linux.png) ;;
              *) echo "::error::Rejected non-baseline: $f"; BAD=1 ;;
            esac
          done < "$RUNNER_TEMP/baselines.txt"
          [ "$BAD" = 0 ]
          [ -s "$RUNNER_TEMP/baselines.txt" ]
          while IFS= read -r f; do
            install -D -m 0644 -- "$f" "$GITHUB_WORKSPACE/$f"
          done < "$RUNNER_TEMP/baselines.txt"
      - name: Commit and push to the design lane
        env:
          PR_BOT_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
        run: |
          git config user.name  "spd-pipeline"
          git config user.email "spd-pipeline@users.noreply.github.com"
          xargs -d '\n' -a "$RUNNER_TEMP/baselines.txt" git add --
          git -c core.hooksPath=/dev/null commit -m "screenshots: Linux baselines for $(wc -l < "$RUNNER_TEMP/baselines.txt" | tr -d ' ') scene image(s), to approve"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PR_BOT_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git -c core.hooksPath=/dev/null push origin HEAD:design
