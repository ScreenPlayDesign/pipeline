name: Deploy → Production

# Production rollback. workflow_call-only: the calling repo declares the
# triggers (`workflow_dispatch` with `rollback-to-tag`; a push to `prod` runs
# this too, and with no tag it does nothing).
#
# A normal release does not run here. Cloudflare Pages builds `prod` on every
# push; the release tag and the CHANGELOG.md / package.json bump are written by
# spd/github-app (publishRelease) onto a disposable `release` branch, so `prod`
# never gains a bookkeeping commit.
#
# Rollback moves history forward only: it never force-pushes or resets `prod`.
# Pass rollback-to-tag, and the "Restore rollback tree" step overlays that old
# tag's files onto the current `prod` tip as one new commit and pushes it to
# `prod`. Pages deploys it and publishRelease tags it like any other push.
# What is live is always the newest tag, even when its content is old.
# The job waits for the `production` environment's required reviewers.

on:
  workflow_call:
    inputs:
      rollback-to-tag:
        description: 'Old release tag to redeploy (e.g. v2026.07.01.1). Empty: the workflow does nothing.'
        type: string
        default: ''
    secrets:
      PR_BOT_TOKEN:
        description: 'Token allowed to push to the protected prod branch'
        required: false

permissions:
  contents: write   # for pushing the rollback commit

jobs:
  deploy:
    name: Rollback (prod)
    runs-on: ${{ fromJSON(vars.SPD_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    if: inputs.rollback-to-tag != ''

    # Job-level, not workflow-level: a top-level `concurrency:` on a
    # workflow_call-only file deadlocks against the job's own group.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false   # never cancel a rollback mid-flight

    # Producer's one-click gate for the rollback action specifically.
    # Configure at: GitHub → Settings → Environments → production →
    # Required reviewers
    environment: production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # full history so the tag checkout + push below work
          # PR_BOT_TOKEN, not the default token: github-actions[bot] cannot
          # bypass branch protection. Without the secret the push below fails
          # against a protected prod.
          token: ${{ secrets.PR_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      # Overlay the old tag's file tree onto the current prod tip as one new
      # commit, so the push is a fast-forward and prod's history only grows.
      - name: Restore rollback tree
        env:
          TAG: ${{ inputs.rollback-to-tag }}   # via env, never interpolated into the script
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'; then
            echo "❌ '$TAG' is not a release tag (vYYYY.MM.DD.N)"; exit 1
          fi
          git fetch --tags --quiet
          git checkout "refs/tags/$TAG" -- .
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "revert: roll back prod tree to $TAG" --allow-empty
          git push origin HEAD:prod
          echo "✓ prod tree restored to $TAG as a new forward commit"
