name: ci

# Canonical CI gate for every SPD project — plain typecheck + Playwright,
# pass or fail by exit code, no AI/LLM involvement anywhere in this file on
# purpose. Hosted HERE — in spd/pipeline, a repo that contains nothing but
# this handful of reusable workflow files — not in any project repo, not in
# foundation-template, and not in spd/github-app either.
#
# Two separate reasons this is its own repo, not folded into an existing one:
#  1. foundation-template is itself starter code that gets cloned wholesale
#     into new projects — CI logic that's supposed to apply platform-wide
#     shouldn't be entangled with "a thing that gets copied to start a
#     project," even referenced by pointer instead of copy-paste.
#  2. github-app hosts the platform's orchestration service (webhook
#     handling, standing-PR sync, provisioning) — real business logic, kept
#     private on purpose. This repo has to be PUBLIC instead: some SPD
#     projects live in GitHub organizations other than ScreenPlayDesign, and
#     GitHub's reusable-workflow `uses:` mechanism only allows a cross-org
#     reference when the source repo is public — a private repo's reusable
#     workflows can only be called from within the same org. Keeping this
#     repo to nothing but CI/deploy YAML (no secret values, no orchestration
#     internals — secrets always resolve against the CALLER's own runtime,
#     never live here) means going public costs nothing sensitive.
#
# Every consuming repo — foundation-template, web-dashboard, every future
# client project, regardless of which org it lives in — keeps only a thin
# run-ci.yml (or, for simple cases, a ci.yml that's just a trigger + this
# call) that does nothing but declare its own trigger and its own
# project-specific inputs, then calls:
#   uses: ScreenPlayDesign/pipeline/.github/workflows/ci.yml@<commit sha>
#   secrets: { SPD_API_TOKEN: ..., STAGING_SUPABASE_URL: ..., STAGING_SUPABASE_PUBLISHABLE_KEY: ... }
# Pin a commit SHA and pass secrets by name — never @main, never `secrets: inherit`.
#
# `vars.*`/`secrets.*` referenced below resolve against whichever repo's
# workflow run is actually calling this — the CALLER's own variables and
# secrets, not this repo's — so one shared file serves every project's own
# config without `inputs:` plumbing for values that already sit in the
# caller's repo settings.
#
# 2026-07-17: standardized on secrets.STAGING_SUPABASE_URL/
# STAGING_SUPABASE_PUBLISHABLE_KEY as the one source for this — dropped
# the earlier vars.VITE_SUPABASE_URL fallback. Two reasons: (1) a bare
# VITE_SUPABASE_URL variable/secret name reads as ambiguous on a repo's
# Settings page — nothing about the name says "this is staging," which
# matters once you're used to scanning for STAGING_*/PROD_* pairs
# elsewhere on that same page. (2) every calling repo already had
# STAGING_SUPABASE_URL/STAGING_SUPABASE_ANON_KEY sitting there as
# secrets from the original Supabase migration-deploy setup (supabase-
# staging.yml), so this reuses existing values instead of asking every
# project to create yet another differently-named copy of the same
# staging credential. Secrets rather than Variables here on purpose too
# — matches what was already in place, even though the anon/publishable
# key itself isn't actually sensitive (RLS is the real access boundary,
# not key secrecy — it ships in the public JS bundle regardless).
#
# Two parallel jobs, not one combined job — typecheck/build and the
# Playwright visual gate run concurrently. The check names a repo's branch
# protection needs in its required-status-checks list are whatever the
# CALLING job-id composites with the names below, e.g.
# "ci / TypeScript + Build smoke test" and "ci / Gherkin + Playwright visual
# gate" if the caller names its job "ci". That composite-name change is the
# one real cost of adopting this pattern — update branch protection in the
# same sitting as switching a repo's workflow files over.

on:
  workflow_call:
    inputs:
      verify-shared-contracts:
        description: 'Fail fast if shared-contracts.ts is missing from frontend/src/types/ (or src/types/ in the old layout) (projects that sync generated Supabase edge-function types into the frontend)'
        type: boolean
        default: false
      target-url:
        description: 'Base URL for the visual gate to test against (a deployed dev/staging/prod preview). Leave blank to let Playwright boot its own local dev server instead.'
        type: string
        default: ''
      pipeline-ref:
        description: 'The ScreenPlayDesign/pipeline commit this caller pins in `uses:` (the lane guard checks out its script at it). Falls back to github.job_workflow_sha when that is set; with neither, the lane guard fails rather than run main.'
        type: string
        default: ''
    # Named secrets only — callers pass these explicitly instead of
    # `secrets: inherit`, so this public workflow never sees anything else.
    secrets:
      SPD_API_TOKEN:
        description: 'Per-project CI token (Settings → API tokens → "CI · <project>") for posting results to the SPD dashboard'
        required: false
      STAGING_SUPABASE_URL:
        required: false
      STAGING_SUPABASE_PUBLISHABLE_KEY:
        required: false

# Read-only by default; nothing in CI writes to the repo.
permissions:
  contents: read

jobs:
  # ── Lane guard — the pipeline's structural rules, enforced as a check ──────
  # Runs on PRs whose BASE is staging or prod (a lane's standing PR). The
  # rules (the lanes model, 2026-10-24) live in scripts/lane-guard.sh, tested
  # by scripts/lane-guard.test.sh:
  #
  #   into staging:
  #     dev     may change anything but design/ — supabase/ rides the dev lane only.
  #     design  may change only design/.
  #     chore   never goes to staging; it goes straight into prod.
  #     any other head branch fails, whatever it carries — proposal-N lands
  #     on dev or design, never on staging.
  #   into prod:
  #     staging may bring anything.
  #     chore   may change anything but supabase/, a dev-only path (spd_config.toml
  #             [lanes] dev_only, e.g. src/types/db.ts) or design/.
  #     any other head branch fails.
  #
  # The scripts are checked out from this repo at the commit the caller pins,
  # never at main. When the dev lane carries migrations the step summary lists
  # them. No gate report carries that flag to the dashboard: record_gate_report
  # takes it only from cli-api's /gate-report, which nothing in CI calls.
  #
  # Add "<caller-job-id> / Lane guard (schema freeze)" to the required
  # status checks on staging's and prod's branch protection alongside the others.
  lane-guard:
    name: Lane guard (schema freeze)
    runs-on: ${{ fromJSON(vars.SPD_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 3
    if: github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'prod')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Without a pinned ref, actions/checkout would take main: refuse instead.
      - name: Resolve the pipeline commit
        env:
          PIPELINE_REF: ${{ inputs.pipeline-ref || github.job_workflow_sha }}
        run: |
          if [ -z "$PIPELINE_REF" ]; then
            echo "❌  No pipeline commit: pass \`pipeline-ref\` with the same commit pinned in \`uses:\`." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ScreenPlayDesign/pipeline
          ref: ${{ inputs.pipeline-ref || github.job_workflow_sha }}
          path: .spd-pipeline
          persist-credentials: false
      - name: Move the pipeline out of the project checkout
        run: mv .spd-pipeline "$RUNNER_TEMP/spd-pipeline"
      # lane-guard-pr.sh diffs with --no-renames (a move out of supabase/
      # still counts) and reads [lanes] dev_only from the base's
      # spd_config.toml, not the PR's own. A file changed only by a release
      # bump commit (subject and content) is left out.
      - name: Check the lane's diff against the lane rules
        shell: bash
        env:
          LANE: ${{ github.head_ref }}   # via env, never interpolated into the script
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --quiet
          # release too: a lane rebased on it carries its bump commit, which the guard leaves out by content
          git fetch origin release --quiet || true
          bash "$RUNNER_TEMP/spd-pipeline/scripts/lane-guard-pr.sh" "$LANE" "origin/$BASE_REF" | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Rehearsal evidence — dev and design reach staging only rehearsed ──────
  # On a dev → staging or design → staging PR, the head commit needs a
  # rehearsal: commit status spd/local-rehearsal (a person's machine, set by
  # `spd rehearse`) or spd/stage-rehearsal (the stage), in state success.
  # A proposal merged into dev by GitHub leaves a merge commit nobody has
  # rehearsed; this check holds the PR until someone does. chore needs none.
  # Reads statuses with the job's GITHUB_TOKEN: callers grant statuses: read.
  # Add "<caller-job-id> / Rehearsal evidence" to staging's required checks.
  rehearsal-evidence:
    name: Rehearsal evidence
    runs-on: ${{ fromJSON(vars.SPD_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 3
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'staging' &&
      (github.head_ref == 'dev' || github.head_ref == 'design')
    permissions:
      statuses: read
    steps:
      - name: Look for a passing rehearsal of the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          LANE: ${{ github.head_ref }}   # via env, never interpolated into the script
        run: |
          FOUND=$(gh api "repos/$REPO/commits/$SHA/status?per_page=100" \
            --jq '[.statuses[] | select((.context == "spd/local-rehearsal" or .context == "spd/stage-rehearsal") and .state == "success") | .context] | join(" ")')
          if [ -n "$FOUND" ]; then
            echo "✅  Rehearsed: $FOUND on ${SHA:0:7}." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Waiting for a rehearsal of ${SHA:0:7}. On a machine with the project: \`git checkout $LANE && git pull && spd rehearse\`." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "When the rehearsal has passed, re-run this check." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  typecheck-build:
    name: TypeScript + Build smoke test
    runs-on: ${{ fromJSON(vars.SPD_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify shared-contracts.ts present
        if: inputs.verify-shared-contracts
        run: |
          if [[ ! -f frontend/src/types/shared-contracts.ts && ! -f src/types/shared-contracts.ts ]]; then
            echo "❌  shared-contracts.ts is missing (looked in frontend/src/types/ and src/types/)."
            echo "    Run sync-contracts.sh (or the deploy workflow's sync step) and commit the result."
            exit 1
          fi

      - name: TypeScript check
        run: bun run typecheck

      - name: Build smoke test
        run: bun run build
        env:
          VITE_SUPABASE_URL:      ${{ secrets.STAGING_SUPABASE_URL             || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || 'placeholder_anon_key' }}

  visual-gate:
    name: Gherkin + Playwright visual gate
    runs-on: ${{ fromJSON(vars.SPD_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 12
    # Every event the caller declares except PRs into staging: there the
    # Rehearsal evidence check stands in for the scenes.
    if: "!(github.event_name == 'pull_request' && github.base_ref == 'staging')"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Run visual gate
        id: playwright
        # BASE_URL is exported conditionally, in-shell, rather than via this
        # step's `env:` block — GitHub Actions can't omit an env key based on
        # a condition, and `env: BASE_URL: ${{ inputs.target-url }}` would set
        # it to a literal empty string when the caller doesn't pass one.
        # Empty-string and unset are NOT the same thing here: Playwright only
        # auto-derives baseURL from its own webServer.url when BASE_URL is
        # truly absent from the environment. An explicitly-empty BASE_URL
        # overrides that and makes every relative page.goto('/...') fail with
        # "Cannot navigate to invalid URL" — confirmed the hard way once this
        # went live for a caller (web-dashboard) that intentionally leaves
        # target-url blank so Playwright boots and points at its own local
        # dev server instead of a deployed preview. (TARGET_URL itself may be
        # empty; it only feeds the conditional export.)
        run: |
          if [ -n "$TARGET_URL" ]; then
            export BASE_URL="$TARGET_URL"
          fi
          bun run test
        continue-on-error: true   # capture result even on failure, so the dashboard-post step below still runs
        env:
          TARGET_URL:             ${{ inputs.target-url }}
          SPD_ALLOW_HOST_DEV:     '1'
          VITE_SUPABASE_URL:      ${{ secrets.STAGING_SUPABASE_URL             || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || 'placeholder_anon_key' }}

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-gate-report-${{ github.run_number }}
          path: |
            review/
            review/artifacts/
          retention-days: 14

      # BRANCH is the PR head for a PR (the lane name), else the pushed branch.
      - name: Post results to SPD dashboard
        if: always() && vars.SPD_API_URL != ''
        env:
          SPD_API_TOKEN:     ${{ secrets.SPD_API_TOKEN }}
          SPD_API_URL:       ${{ vars.SPD_API_URL }}
          SPD_PROJECT_SLUG:  ${{ vars.SPD_PROJECT_SLUG }}
          BRANCH:            ${{ github.event.pull_request.head.ref || github.ref_name }}
          GITHUB_RUN_ID:     ${{ github.run_id }}
          GITHUB_RUN_URL:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAYWRIGHT_EXIT:   ${{ steps.playwright.outcome }}
        run: |
          if [ -f ".stage/scripts/post-spd-results.ts" ]; then
            bun run .stage/scripts/post-spd-results.ts || echo "⚠  SPD result post failed (non-fatal)"
          elif [ -f "scripts/post-spd-results.ts" ]; then
            bun run scripts/post-spd-results.ts || echo "⚠  SPD result post failed (non-fatal)"
          else
            echo "scripts/post-spd-results.ts not found — skipping SPD report"
          fi

      - name: Fail job if tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
